# ⚠️  THIS FILE DOES NOTHING WHERE IT SITS ⚠️
#
# It is the replacement for the "Build and Push" workflow, staged here because
# the agent sandbox forbids writing under the CI workflows directory. To apply it
# (this also deletes the Claude Code workflow and removes the staging scaffolding,
# this banner included):
#
#     ./ops/ci/apply-public-cleanup.sh
#
# Changes vs. the current version:
#   1. The Dokploy deploy only runs when the DOKPLOY_WEBHOOK_URL secret exists,
#      so forks (and anyone who clones this now-public repo) never try to deploy.
#   2. The webhook URL is passed via env, not interpolated into the shell command,
#      and curl now fails the job on an HTTP error instead of silently "succeeding".
#   3. The workflow only reacts to pushes on this repository, so a pull request
#      from a fork whose branch happens to be named "main" cannot trigger it.
#   4. The build checks out the exact commit named in the image tag.

name: Build and Push

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # workflow_run also fires for pull_request runs, including runs from forks
    # whose head branch is named "main". Only build for real pushes to this repo.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Without an explicit ref, workflow_run checks out the default branch
          # tip, which may already be ahead of the commit we are tagging.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate image tags
        id: image-tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:sha-${SHA_SHORT}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Railpack
        uses: iloveitaly/github-action-railpack@master
        with:
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: ${{ steps.image-tags.outputs.tags }}

  deploy-to-dokploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_branch == 'main'

    steps:
      # The `secrets` context is not available in job-level `if:` conditions,
      # so the presence check has to happen inside the step.
      - name: Trigger Dokploy Deployment via Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DOKPLOY_WEBHOOK_URL}" ]; then
            echo "::notice::DOKPLOY_WEBHOOK_URL is not configured — skipping deployment."
            echo "This is expected in forks: only the upstream repository deploys."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "${DOKPLOY_WEBHOOK_URL}"
          echo "Deployment triggered. Health check is performed by Dokploy internally."
