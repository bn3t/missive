services:
  postgres:
    image: postgres:18
    container_name: missive-postgres
    environment:
      POSTGRES_DB: missive
      POSTGRES_USER: missive
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U missive']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  missive:
    image: ghcr.io/YOUR_GITHUB_ORG/missive:latest
    container_name: missive
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://missive:changeme@postgres:5432/missive
      BETTER_AUTH_SECRET: replace-with-a-random-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000

      # Transport: choose "smtp", "ses", or "smtp,ses" (first = default)
      EMAIL_TRANSPORTS: smtp
      EMAIL_FROM: noreply@example.com

      # SMTP settings (required when smtp is in EMAIL_TRANSPORTS)
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: smtp-user
      SMTP_PASS: smtp-password

      # SES settings (required when ses is in EMAIL_TRANSPORTS)
      # AWS_REGION: us-east-1
      # AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      # AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
