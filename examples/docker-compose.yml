services:
  postgres:
    image: postgres:18
    container_name: missive-postgres
    environment:
      POSTGRES_DB: missive
      POSTGRES_USER: missive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # postgres:18 stores its data in /var/lib/postgresql/18/docker,
      # so the volume must be mounted on the parent directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U missive']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  missive:
    image: ghcr.io/bn3t/missive:latest
    container_name: missive
    ports:
      - '3000:3000'
    # All application settings live in .env next to this file.
    # See the "Deploy with Docker" chapter of the README.
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
