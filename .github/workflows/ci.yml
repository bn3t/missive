name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Compile, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile (type-check)
        run: npm run compile

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
          BETTER_AUTH_SECRET: "ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci"
          BETTER_AUTH_URL: "http://localhost:3000"
          EMAIL_TRANSPORTS: "smtp"
          EMAIL_FROM: "ci@example.com"
          SMTP_HOST: "localhost"
